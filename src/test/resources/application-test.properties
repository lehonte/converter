spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/convertorTest}
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.placeholders.admin_username=admin
spring.flyway.placeholders.admin_password_hash=${ADMIN_PASSWORD_HASH}

spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration=36000
